description: Kaminashi Inc. (株式会社カミナシ) is a Tokyo-based SaaS company founded in
  December 2016 under its former corporate name Ulysses Inc. (ユリシーズ株式会社). It builds
  the Kaminashi frontline-operations DX platform for deskless workers — digital checklists
  and inspections, equipment maintenance (CMMS), frontline employee management, training
  and manuals, and reporting — serving food manufacturing, machine manufacturing, logistics,
  hotels, and building maintenance. Surfaced as a portfolio company of 500 Global and a16z.
  The company is ISMS (ISO/IEC 27001) certified and publishes no public developer API surface
  as of July 2026.
